[project]
name = "lockedin"
version = "0.1.0"
description = "Personal training tracker and coach"
requires-python = ">=3.12"
# The one list of dependencies. Vercel installs the exact versions in uv.lock (requirements.txt mirrors it);
# after changing anything here, run `make lock` and commit both.
dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
    "fitdecode>=0.10,<1",
    "pyjwt[crypto]>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
    "anthropic>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.32,<1",
    "fit-tool>=0.9.13,<1",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lockedin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient nags about a not-yet-common httpx successor; harmless for tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.vercel]
# FastAPI app for the "api" service in vercel.json
entrypoint = "lockedin.app:app"

[tool.ruff]
line-length = 180
extend-exclude = ["web"]

[tool.ruff.lint]
# Real-bug rules plus import order; the codebase's terse style (`a; b`, short loop names) is left alone.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008", "B905", "E702", "E741"]  # B008: FastAPI's Depends() defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]  # pytest fixtures shadowed by parameters
