[project]
name = "lockedin"
version = "0.1.0"
description = "Personal training tracker and coach"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "fitdecode>=0.10",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
    "fit-tool>=0.9.13",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lockedin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient nags about a not-yet-common httpx successor; harmless for tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.vercel]
# FastAPI app for the "api" service in vercel.json
entrypoint = "lockedin.app:app"
