name: LockedIn
options:
  bundleIdPrefix: be.stefmartens.lockedin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LockedIn:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.stefmartens.lockedin.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LockedIn
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: [LockedInTests]
  LockedInTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]  # feed-sample.json is bundled as a resource
    dependencies:
      - target: LockedIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.stefmartens.lockedin.watch.tests
        GENERATE_INFOPLIST_FILE: YES
